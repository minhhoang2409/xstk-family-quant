[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xsmn-alpha"
version = "0.2.0"
description = "Stage 2: XSMN Single-Cage Alpha Discovery & Calibrated Probability Engine"
readme = "QUY_TAC_VA_DIEM_HOA_VON.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<2.2.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xsmn_alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
